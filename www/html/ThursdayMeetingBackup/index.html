<!DOCTYPE html>
<html lang="en"><head>
<meta http-equiv="content-type" content="text/html; charset=windows-1252">
		<title>Contact Manager</title>
		<link rel="stylesheet" href="./css.css">
		<script src="./Index.js">
		</script>
		<script>
			function showPwrd() {
			var x = document.getElementById("Password");
			if (x.type === "password")
			{
				x.type = "text";
			}
			else 
			{
				x.type = "password";
			}
			} 
		</script>
	</head>

	<body>

		<div id="LoginPage">
			<h1>Please Login</h1>

			<div>
				<p><span id="Required">Marked*</span> fields are required</p>
			</div>

			<div class="mainPageContainer">
				<div class="user">
					<label>Username*</label>
				</div>
				<div class="userfield">
					<input type="email" id="Username" required="">
				</div>
				<div class="pwrd">
					<label>Password*</label>
				</div>
				<div class="pwrdfield">
					<input type="password" id="Password" required="">
				</div>
				<div class="showpwrd">
					<div id= "showdiv">
						<input type="checkbox" onclick="showPwrd()"><p id="showPwrdText">&nbsp;Show Password</p>
					</div>
				</div>
				<div class="login">
					<button onclick="Login()" id="Login">Login</button>
				</div>
				<div class="error">
					<p id="loginResult" class="footer"></p>
				</div>
			</div>

			<div>
				<p>Don't have an account? <a href="signup.html">Sign Up</a></p>
			</div>
		</div>
	</body>
</html>
